<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // Guard against extension interceptors (e.g. Chrome extension request interceptors like Urban VPN)
        // failing with "TypeError: Cannot set property fetch of #<Window> which has only a getter"
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = originalFetch;
          if (originalFetch) {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(fn) {
                currentFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (_) {}

        // Prevent external extension errors from interrupting page execution
        if (typeof window !== 'undefined') {
          window.addEventListener('error', function(event) {
            if (event && event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) {
              event.preventDefault();
              event.stopPropagation();
            }
          }, true);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartSathi AI</title>
    <meta name="description" content="SmartSathi AI — Complete all-in-one productivity platform with 45+ Image tools, comprehensive PDF Studio, AI tools, AI Resume & Career Suite, and Calculators. Created by Varun Kumar." />
    <meta name="author" content="Varun Kumar" />
    <meta name="robots" content="index, follow" />
    
    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SmartSathi AI" />
    <meta property="og:description" content="SmartSathi AI — Complete all-in-one productivity platform with 45+ Image tools, comprehensive PDF Studio, AI tools, AI Resume & Career Suite, and Calculators. Created by Varun Kumar." />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SmartSathi AI" />
    <meta name="twitter:description" content="SmartSathi AI — Complete all-in-one productivity platform with 45+ Image tools, comprehensive PDF Studio, AI tools, AI Resume & Career Suite, and Calculators. Created by Varun Kumar." />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- WebSite JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SmartSathi AI",
        "alternateName": "SmartSathi",
        "description": "SmartSathi AI — Complete all-in-one productivity platform with 45+ Image tools, comprehensive PDF Studio, AI tools, AI Resume & Career Suite, and Calculators. Created by Varun Kumar.",
        "creator": {
          "@type": "Person",
          "name": "Varun Kumar"
        }
      }
    </script>
    <!-- Dynamic Canonical Link setup to reflect current origin without inventing domains -->
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined' && window.location) {
            var canonicalLink = document.createElement('link');
            canonicalLink.setAttribute('rel', 'canonical');
            canonicalLink.setAttribute('href', window.location.origin + window.location.pathname);
            document.head.appendChild(canonicalLink);
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
